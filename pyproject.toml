[project]
name = "gilareporttool"
version = "0.1.0"
description = "Transparent, QA/QC-ready Gila–San Francisco consumptive-use reporting"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "geopandas>=1.1.3",
    "netcdf4>=1.7.4",
    "openpyxl>=3.1.5",
    "pandas>=3.0.3",
    "pyogrio>=0.12.1",
    "rasterstats>=0.21.0",
    "rioxarray>=0.22.0",
    "shapely>=2.1.2",
    "xarray>=2026.4.0",
]
